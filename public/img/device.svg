<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Website audit dashboard with a 92 performance score and a rising trend">
  <defs>
    <radialGradient id="d_bg" cx="50%" cy="22%" r="92%">
      <stop offset="0%" stop-color="#8499a1"/>
      <stop offset="55%" stop-color="#5d7484"/>
      <stop offset="100%" stop-color="#43576b"/>
    </radialGradient>
    <linearGradient id="d_card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e6"/>
      <stop offset="100%" stop-color="#efe6c9"/>
    </linearGradient>
    <linearGradient id="d_area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#20305a" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#20305a" stop-opacity="0"/>
    </linearGradient>
    <filter id="d_soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1a2747" flood-opacity="0.30"/>
    </filter>
    <pattern id="d_dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#f8f1da" fill-opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#d_bg)"/>
  <rect width="600" height="600" fill="url(#d_dots)"/>
  <g filter="url(#d_soft)"><rect x="86" y="120" width="428" height="360" rx="28" fill="url(#d_card)"/></g>
  <!-- header -->
  <circle cx="120" cy="160" r="6" fill="#b6c0c6"/>
  <circle cx="140" cy="160" r="6" fill="#cbd1d4"/>
  <circle cx="160" cy="160" r="6" fill="#dfe2de"/>
  <rect x="408" y="152" width="72" height="16" rx="8" fill="#e3dcc0"/>
  <!-- score ring -->
  <g transform="translate(432,250)">
    <circle r="46" fill="none" stroke="#e6ddbf" stroke-width="14"/>
    <circle r="46" fill="none" stroke="#20305a" stroke-width="14" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="72" transform="rotate(-90)"/>
    <text x="0" y="10" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="32" fill="#20305a">92</text>
  </g>
  <!-- chart gridlines -->
  <g stroke="#cdbf95" stroke-width="1.5" stroke-opacity="0.55">
    <line x1="118" y1="332" x2="356" y2="332"/>
    <line x1="118" y1="380" x2="356" y2="380"/>
    <line x1="118" y1="428" x2="482" y2="428"/>
  </g>
  <!-- area + trend line -->
  <path d="M118 410 L168 392 L218 400 L268 356 L318 372 L368 312 L418 332 L468 268 L468 428 L118 428 Z" fill="url(#d_area)"/>
  <path d="M118 410 L168 392 L218 400 L268 356 L318 372 L368 312 L418 332 L468 268" fill="none" stroke="#20305a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="468" cy="268" r="7" fill="#fbf6e6" stroke="#20305a" stroke-width="4"/>
  <!-- footer stat bars -->
  <rect x="118" y="452" width="54" height="11" rx="5.5" fill="#5d7484" fill-opacity="0.8"/>
  <rect x="184" y="452" width="92" height="11" rx="5.5" fill="#20305a" fill-opacity="0.7"/>
</svg>
