<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Local SEO network with a central map location pin">
  <defs>
    <radialGradient id="n_bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#7c909a"/>
      <stop offset="58%" stop-color="#5d7484"/>
      <stop offset="100%" stop-color="#45596d"/>
    </radialGradient>
    <pattern id="n_dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#f8f1da" fill-opacity="0.06"/>
    </pattern>
    <filter id="n_soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1a2747" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="600" height="600" fill="url(#n_bg)"/>
  <rect width="600" height="600" fill="url(#n_dots)"/>
  <!-- connections -->
  <g stroke="#f8f1da" stroke-opacity="0.32" stroke-width="2">
    <line x1="300" y1="300" x2="150" y2="160"/>
    <line x1="300" y1="300" x2="470" y2="150"/>
    <line x1="300" y1="300" x2="150" y2="450"/>
    <line x1="300" y1="300" x2="465" y2="445"/>
    <line x1="150" y1="160" x2="470" y2="150"/>
    <line x1="150" y1="160" x2="150" y2="450"/>
    <line x1="470" y1="150" x2="465" y2="445"/>
    <line x1="150" y1="450" x2="465" y2="445"/>
    <line x1="95" y1="300" x2="150" y2="160"/>
    <line x1="520" y1="300" x2="470" y2="150"/>
  </g>
  <!-- outer nodes -->
  <g>
    <circle cx="150" cy="160" r="16" fill="#f3ead0" stroke="#20305a" stroke-width="4"/>
    <circle cx="470" cy="150" r="13" fill="#f3ead0" stroke="#20305a" stroke-width="4"/>
    <circle cx="150" cy="450" r="13" fill="#f3ead0" stroke="#20305a" stroke-width="4"/>
    <circle cx="465" cy="445" r="18" fill="#f3ead0" stroke="#20305a" stroke-width="4"/>
    <circle cx="520" cy="300" r="9" fill="#f3ead0" stroke="#20305a" stroke-width="3"/>
    <circle cx="95" cy="300" r="9" fill="#f3ead0" stroke="#20305a" stroke-width="3"/>
  </g>
  <!-- central location pin -->
  <g filter="url(#n_soft)" transform="translate(300,296)">
    <path d="M0 -80 C 44 -80 79 -45 79 -1 C 79 54 18 92 0 122 C -18 92 -79 54 -79 -1 C -79 -45 -44 -80 0 -80 Z" fill="#f8f1da"/>
    <circle cx="0" cy="-6" r="31" fill="#20305a"/>
  </g>
</svg>
