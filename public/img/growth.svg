<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 600" role="img" aria-label="Ascending growth chart showing rising results">
  <defs>
    <radialGradient id="g_bg" cx="50%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#8499a1"/><stop offset="60%" stop-color="#5d7484"/><stop offset="100%" stop-color="#45596d"/>
    </radialGradient>
    <linearGradient id="g_card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf6e6"/><stop offset="100%" stop-color="#efe6c9"/>
    </linearGradient>
    <linearGradient id="g_bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c3c63"/><stop offset="100%" stop-color="#20305a"/>
    </linearGradient>
    <filter id="g_soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="26" flood-color="#1a2747" flood-opacity="0.3"/>
    </filter>
    <pattern id="g_dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#f8f1da" fill-opacity="0.07"/></pattern>
  </defs>
  <rect width="450" height="600" fill="url(#g_bg)"/>
  <rect width="450" height="600" fill="url(#g_dots)"/>
  <g filter="url(#g_soft)"><rect x="45" y="80" width="360" height="450" rx="28" fill="url(#g_card)"/></g>
  <!-- header -->
  <rect x="82" y="118" width="120" height="14" rx="7" fill="#20305a" fill-opacity="0.85"/>
  <rect x="82" y="142" width="74" height="10" rx="5" fill="#c8bd95"/>
  <!-- baseline -->
  <line x1="82" y1="462" x2="368" y2="462" stroke="#cdbf95" stroke-width="2"/>
  <!-- ascending bars -->
  <g fill="url(#g_bar)">
    <rect x="96" y="394" width="48" height="68" rx="9"/>
    <rect x="162" y="344" width="48" height="118" rx="9"/>
    <rect x="228" y="286" width="48" height="176" rx="9"/>
    <rect x="294" y="206" width="48" height="256" rx="9"/>
  </g>
  <!-- trend line -->
  <path d="M120 404 L186 356 L252 300 L320 210" fill="none" stroke="#f8f1da" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow head -->
  <path d="M300 214 L322 207 L318 230" fill="none" stroke="#f8f1da" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- data points -->
  <circle cx="120" cy="404" r="6.5" fill="#f8f1da"/>
  <circle cx="186" cy="356" r="6.5" fill="#f8f1da"/>
  <circle cx="252" cy="300" r="6.5" fill="#f8f1da"/>
</svg>
